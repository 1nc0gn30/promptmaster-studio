[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptmaster-studio"
version = "1.0.0"
description = "Zero-dependency Prompt Engineering & Meta-Optimization Studio, Linter, Token Estimator, MCP Server, and Interactive Curriculum."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "PromptMaster Studio Team", email = "engineering@promptmaster.dev" }
]
keywords = [
    "prompt-engineering",
    "meta-optimizer",
    "llm",
    "prompt-linter",
    "token-estimator",
    "mcp-server",
    "anthropic-xml",
    "openai-chat",
    "google-gemini",
    "chain-of-thought",
    "curriculum",
    "zero-dependency",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
promptmaster-studio = "promptmaster_studio.cli:main"
promptmaster = "promptmaster_studio.cli:main"

[project.urls]
Homepage = "https://github.com/promptmaster/promptmaster-studio"
Documentation = "https://github.com/promptmaster/promptmaster-studio#readme"
Repository = "https://github.com/promptmaster/promptmaster-studio.git"
Issues = "https://github.com/promptmaster/promptmaster-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptmaster_studio = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
