name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Install promptmaster-studio in editable mode
        run: |
          pip install -e .

      - name: Verify zero external runtime dependencies
        shell: bash
        run: |
          python -c "import sys; import promptmaster_studio; print('PromptMaster Studio imported successfully with zero external dependencies.')"

      - name: Run test suite with pytest
        run: |
          pytest --verbose --tb=short

      - name: Test CLI invocation
        shell: bash
        run: |
          promptmaster --help
          promptmaster-studio --help
          python -m promptmaster_studio --help
          python -m promptmaster_studio.cli --help
          promptmaster stats
          promptmaster lint "Please summarize this document carefully and kindly if possible."
          promptmaster tokens "Hello, how can I optimize this prompt?"
