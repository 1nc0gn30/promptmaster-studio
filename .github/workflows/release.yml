name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-harden:
    name: Build, SBOM, Diffoscope & Cosign Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and diffoscope
        run: |
          python -m pip install --upgrade pip build wheel twine
          sudo apt-get update && sudo apt-get install -y diffoscope

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: First deterministic build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export PYTHONHASHSEED=0
          rm -rf build *.egg-info src/*.egg-info dist/build-1
          mkdir -p dist/build-1
          python -m build --outdir dist/build-1
          python - dist/build-1 << 'PY'
          import glob, gzip, io, os, sys, tarfile
          epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          for path in sorted(glob.glob(os.path.join(sys.argv[1], "*.tar.gz"))):
              with tarfile.open(path, "r:gz") as src:
                  members = sorted(src.getmembers(), key=lambda m: m.name)
                  payloads = [(m, src.extractfile(m).read() if m.isfile() else None) for m in members]
              raw_tar = io.BytesIO()
              with tarfile.open(fileobj=raw_tar, mode="w", format=tarfile.PAX_FORMAT) as dst:
                  for m, data in payloads:
                      ti = tarfile.TarInfo(name=m.name)
                      ti.type = m.type
                      ti.mode = 0o755 if (m.isdir() or (m.mode & 0o111)) else 0o644
                      ti.uid = ti.gid = 0
                      ti.uname = ti.gname = ""
                      ti.mtime = epoch
                      ti.linkname = m.linkname
                      ti.size = len(data) if data is not None else 0
                      dst.addfile(ti, io.BytesIO(data) if data is not None else None)
              with open(path, "wb") as fh:
                  with gzip.GzipFile(filename="", mode="wb", fileobj=fh, mtime=epoch) as gz:
                      gz.write(raw_tar.getvalue())
          PY

      - name: Second deterministic build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export PYTHONHASHSEED=0
          rm -rf build *.egg-info src/*.egg-info dist/build-2
          mkdir -p dist/build-2
          python -m build --outdir dist/build-2
          python - dist/build-2 << 'PY'
          import glob, gzip, io, os, sys, tarfile
          epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          for path in sorted(glob.glob(os.path.join(sys.argv[1], "*.tar.gz"))):
              with tarfile.open(path, "r:gz") as src:
                  members = sorted(src.getmembers(), key=lambda m: m.name)
                  payloads = [(m, src.extractfile(m).read() if m.isfile() else None) for m in members]
              raw_tar = io.BytesIO()
              with tarfile.open(fileobj=raw_tar, mode="w", format=tarfile.PAX_FORMAT) as dst:
                  for m, data in payloads:
                      ti = tarfile.TarInfo(name=m.name)
                      ti.type = m.type
                      ti.mode = 0o755 if (m.isdir() or (m.mode & 0o111)) else 0o644
                      ti.uid = ti.gid = 0
                      ti.uname = ti.gname = ""
                      ti.mtime = epoch
                      ti.linkname = m.linkname
                      ti.size = len(data) if data is not None else 0
                      dst.addfile(ti, io.BytesIO(data) if data is not None else None)
              with open(path, "wb") as fh:
                  with gzip.GzipFile(filename="", mode="wb", fileobj=fh, mtime=epoch) as gz:
                      gz.write(raw_tar.getvalue())
          PY
          rm -rf build *.egg-info src/*.egg-info

      - name: Diffoscope reproducibility check
        run: |
          diffoscope dist/build-1 dist/build-2 --text dist/reproducibility-report.txt || true
          cat dist/reproducibility-report.txt
          cmp dist/build-1/*.whl dist/build-2/*.whl && echo "[✓] Wheel builds are bit-for-bit identical."
          cmp dist/build-1/*.tar.gz dist/build-2/*.tar.gz && echo "[✓] Source distributions are bit-for-bit identical."
          if ! cmp -s dist/build-1/*.whl dist/build-2/*.whl || ! cmp -s dist/build-1/*.tar.gz dist/build-2/*.tar.gz; then
            echo "[x] Reproducible build assertion failed: build outputs differ across independent runs." >&2
            exit 1
          fi

      - name: Copy final artifacts
        run: |
          mkdir -p dist/release
          cp dist/build-1/* dist/release/
          cp dist/reproducibility-report.txt dist/release/reproducibility-report.txt
          (cd dist/release && sha256sum * > SHA256SUMS)

      - name: Generate Syft SPDX SBOM
        run: |
          syft dir:. -o spdx-json=dist/release/promptmaster-studio.spdx.json
          syft dist/release/ -o spdx-json=dist/release/artifacts.spdx.json

      - name: Sign packages and generate Rekor provenance bundle
        shell: bash
        run: |
          for artifact in dist/release/*.whl dist/release/*.tar.gz dist/release/SHA256SUMS dist/release/*.spdx.json; do
            if [ -f "$artifact" ]; then
              cosign sign-blob \
                --bundle "${artifact}.bundle" \
                --yes \
                "$artifact"
              cosign verify-blob \
                --bundle "${artifact}.bundle" \
                --rekor-url "https://rekor.sigstore.dev" \
                --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/.*" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                "$artifact"
            fi
          done

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance-bundle
          path: dist/release/
